ame: Promote to PROD

on:
  workflow_dispatch: # Manual trigger for production deployment (highly recommended)
    inputs:
      ref:
        description: 'Git Ref (branch or tag) to deploy'
        required: true
        default: 'main' # Default to the main branch for production
      image_tag:
        description: 'Docker Image Tag to deploy (e.g., preprod-sha)'
        required: false # Optional, if image tag is derived or not used

  # Optional: Trigger automatically after PREPROD deployment success
  # workflow_run:
  #   workflows: ["Promote to PREPROD"] # Name of the PREPROD workflow
  #   types:
  #     - completed
  #   branches:
  #     - main # Ensure it runs only for the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD # Define a PROD environment in GitHub with required approvals

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref || github.ref }} # Use input ref or current ref

    - name: Deploy to PROD
      run: |
        echo "Promoting application to PROD environment..."
        # Add your specific deployment commands here.
        # This could involve:
        # - Pulling the specific Docker image (e.g., from PREPROD stage):
        #   docker pull my-django-app:${{ github.event.inputs.image_tag || 'latest' }}
        # - Updating Kubernetes deployment:
        #   kubectl config use-context my-k8s-cluster-prod
        #   kubectl set image deployment/my-app my-container=my-django-app:${{ github.event.inputs.image_tag || 'latest' }} -n my-namespace
        # - Running Ansible playbooks with production inventory:
        #   ansible-playbook -i production_inventory deploy_prod.yml
        echo "Deployment to PROD completed."
