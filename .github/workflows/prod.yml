ame: Preprod to Main Rule

on:
  pull_request:
    branches:
      - main  # Trigger when a pull request targets main

jobs:
  validate-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check Source Branch
        run: |
          if [[ "${{ github.event.pull_request.head.ref }}" != "preprod" ]]; then
            echo "Only merges from preprod to main are allowed."
            exit 1
          fi